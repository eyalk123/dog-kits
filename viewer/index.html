<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dog-kits · תצוגת מודלים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f3ee; --panel: #fffdf9; --ink: #23201c; --muted: #7a7268;
    --line: #e6dfd4; --accent: #c8553d; --accent-soft: #f3ddd6;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Rubik", system-ui, sans-serif; background: var(--bg); color: var(--ink);
    display: grid; grid-template-columns: 300px 1fr; grid-template-rows: auto 1fr; height: 100vh;
  }
  header {
    grid-column: 1 / -1; display: flex; align-items: baseline; gap: 14px;
    padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 700; }
  header h1 span { color: var(--accent); }
  header .meta { color: var(--muted); font-size: 13px; margin-inline-start: auto; direction: ltr; }
  aside { border-inline-end: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 12px; }
  .variant {
    width: 100%; text-align: start; border: 1px solid var(--line); background: #fff; border-radius: 10px;
    padding: 10px 12px; margin-bottom: 8px; cursor: pointer; font: inherit; color: inherit;
    display: flex; gap: 10px; align-items: center;
  }
  .variant:hover { border-color: #d4c8b8; }
  .variant.active { border-color: var(--accent); background: var(--accent-soft); }
  .swatch { width: 26px; height: 26px; border-radius: 50%; flex: none; position: relative; border: 1px solid #0002; }
  .swatch i { position: absolute; inset: 7px; border-radius: 50%; }
  .variant b { display: block; font-weight: 500; }
  .variant small { color: var(--muted); font-size: 12px; }
  main { position: relative; min-height: 0; }
  #stage { position: absolute; inset: 0; }
  .toolbar {
    position: absolute; top: 14px; inset-inline-start: 14px; display: flex; gap: 6px; flex-wrap: wrap;
  }
  .toolbar button, .toolbar label {
    font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--panel);
    border-radius: 8px; padding: 6px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  }
  .toolbar button:hover { border-color: var(--accent); }
  .toolbar input[type=color] { width: 22px; height: 22px; border: none; padding: 0; background: none; cursor: pointer; }
  .info {
    position: absolute; bottom: 14px; inset-inline-start: 14px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font-size: 13px; min-width: 220px;
  }
  .info dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; }
  .info dt { color: var(--muted); }
  .info dd { margin: 0; }
  .info a { color: var(--accent); }
  .ltr { direction: ltr; unicode-bidi: isolate; }
  .status { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); pointer-events: none; }
  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; }
    aside { border-inline-end: none; border-bottom: 1px solid var(--line); display: flex; gap: 8px; overflow-x: auto; }
    .variant { min-width: 200px; margin: 0; }
    main { min-height: 60vh; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<header>
  <h1>dog-kits <span>·</span> תצוגת מודלים</h1>
  <div class="meta" id="meta"></div>
</header>
<aside id="list"></aside>
<main>
  <div id="stage"></div>
  <div class="status" id="status">טוען מודלים…</div>
  <div class="toolbar">
    <button data-view="front">חזית</button>
    <button data-view="back">גב</button>
    <button data-view="angle">זווית</button>
    <label>גוף <input type="color" id="c-base"></label>
    <label>כיתוב <input type="color" id="c-inlay"></label>
  </div>
  <div class="info" id="info" hidden></div>
</main>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { STLLoader } from "three/addons/loaders/STLLoader.js";

const stage = document.getElementById("stage");
const statusEl = document.getElementById("status");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0xf6f3ee);
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 2000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xffffff, 0xd8cfc2, 1.6));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(40, 80, 60);
scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 1.3);
fill.position.set(-50, -80, -40);
scene.add(fill);

// 10 mm grid so the size reads at a glance.
const grid = new THREE.GridHelper(200, 20, 0xd9cfc1, 0xe9e2d7);
grid.position.y = -0.3;   // just under the model, so it never shows through the bottom face
scene.add(grid);

// STL is Z-up; three.js is Y-up. The tag lies on the grid, face up.
const model = new THREE.Group();
model.rotation.x = -Math.PI / 2;
scene.add(model);

const loader = new STLLoader();
const cache = new Map();
const materials = {
  base: new THREE.MeshStandardMaterial({ roughness: 0.65, metalness: 0 }),
  inlay: new THREE.MeshStandardMaterial({ roughness: 0.55, metalness: 0 }),
};
let manifest, current, size = new THREE.Vector3();

function resize() {
  const { clientWidth: w, clientHeight: h } = stage;
  renderer.setSize(w, h, false);
  renderer.domElement.style.width = w + "px";
  renderer.domElement.style.height = h + "px";
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);

function setView(view) {
  const d = Math.max(size.x, size.y, 30) * 2.1;
  // A small z offset keeps the tag's top edge at the top of the screen. From
  // below, the offset is negative so the back reads as if the tag were turned
  // over sideways, like a page.
  const e = d * 0.01;
  const pos = { front: [0, d, e], back: [0, -d, -e], angle: [d * 0.35, d * 0.75, d * 0.6] }[view];
  camera.position.set(...pos);
  grid.visible = view !== "back";
  controls.target.set(0, size.z / 2, 0);
  controls.update();
}

// "x.stl" loads directly. "x.json#part" reads base64 STL from a JSON bundle
// (scripts/bundle_artifact.py), for hosts that won't serve .stl files.
const bundles = new Map();
async function loadGeometry(file) {
  if (!cache.has(file)) {
    const [path, part] = file.split("#");
    cache.set(file, part
      ? (async () => {
          if (!bundles.has(path)) bundles.set(path, fetch("out/" + path).then(r => r.json()));
          const b64 = (await bundles.get(path))[part];
          const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
          return loader.parse(bytes.buffer);
        })()
      : loader.loadAsync("out/" + file));
  }
  return cache.get(file);
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function show(id) {
  const v = manifest.variants.find(x => x.id === id) || manifest.variants[0];
  current = v;
  document.querySelectorAll(".variant").forEach(b => b.classList.toggle("active", b.dataset.id === v.id));
  statusEl.textContent = "טוען…";
  statusEl.hidden = false;
  const geoms = await Promise.all(Object.entries(v.files).map(async ([part, file]) => [part, await loadGeometry(file)]));
  model.clear();
  const box = new THREE.Box3();
  for (const [part, g] of geoms) {
    g.computeBoundingBox();
    box.union(g.boundingBox);
    model.add(new THREE.Mesh(g, materials[part] || materials.base));
  }
  // Centre on the grid, resting on it.
  const c = box.getCenter(new THREE.Vector3());
  model.children.forEach(m => m.position.set(-c.x, -c.y, -box.min.z));
  box.getSize(size);
  applyColors(v.colors);
  statusEl.hidden = true;

  const p = v.params, s = v.sizes || {};
  const downloadable = Object.values(v.files).every(f => !f.includes("#"));
  const links = downloadable
    ? Object.entries(v.files).map(([part, f]) => `<a href="out/${esc(f)}" download>${part}.stl</a>`).join(" · ")
    : `<span style="color:var(--muted)">ב-GitHub Pages</span>`;
  const info = document.getElementById("info");
  info.hidden = false;
  info.innerHTML = `<dl>
    <dt>שם</dt><dd>${esc(p.name ?? "")}${s.name_size ? ` <small class="ltr">(${s.name_size} mm)</small>` : ""}</dd>
    ${p.back_text ? `<dt>גב</dt><dd class="ltr">${esc(p.back_text)}</dd>` : ""}
    <dt>מידות</dt><dd class="ltr">${size.x.toFixed(1)} × ${size.y.toFixed(1)} × ${size.z.toFixed(1)} mm</dd>
    <dt>קבצים</dt><dd class="ltr">${links}</dd></dl>`;
  if (location.hash.slice(1) !== v.id) history.replaceState(null, "", "#" + v.id);
  setView("angle");
}

function applyColors(colors) {
  for (const part of ["base", "inlay"]) {
    const value = colors?.[part] || (part === "base" ? "#f2efe8" : "#1f6f8b");
    materials[part].color.set(value);
    document.getElementById("c-" + part).value = value;
  }
}

for (const part of ["base", "inlay"]) {
  document.getElementById("c-" + part).addEventListener("input", e => materials[part].color.set(e.target.value));
}
document.querySelectorAll("[data-view]").forEach(b => b.addEventListener("click", () => setView(b.dataset.view)));
addEventListener("hashchange", () => manifest && show(location.hash.slice(1)));

try {
  manifest = await (await fetch("out/manifest.json", { cache: "no-store" })).json();
} catch {
  statusEl.textContent = "לא נמצא out/manifest.json — הריצו קודם scripts/build.py";
  throw new Error("no manifest");
}
const when = new Date(manifest.generated_at).toLocaleString("he-IL", { dateStyle: "short", timeStyle: "short" });
document.getElementById("meta").textContent = [manifest.commit, when].filter(Boolean).join(" · ");
document.getElementById("list").innerHTML = manifest.variants.map(v => `
  <button class="variant" data-id="${esc(v.id)}">
    <span class="swatch" style="background:${esc(v.colors?.base)}"><i style="background:${esc(v.colors?.inlay)}"></i></span>
    <span><b>${esc(v.title)}</b><small>${esc(v.model)}</small></span>
  </button>`).join("");
document.querySelectorAll(".variant").forEach(b => b.addEventListener("click", () => show(b.dataset.id)));
await show(location.hash.slice(1));

renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
